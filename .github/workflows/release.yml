# Publish a tagged version to npm with provenance (see #132).
#
# Trigger: push a `vX.Y.Z` tag whose version matches package.json. The job
# builds and tests from a clean checkout with the frozen lockfile, publishes
# through npm Trusted Publishing (OIDC — no long-lived npm token in secrets),
# and creates the matching GitHub release with generated notes.
#
# One-time npm setup (package settings → Publishing access → Trusted Publisher):
#   Publisher:         GitHub Actions
#   Organization/user: V1ki
#   Repository:        dsh-plugin-subscriptions
#   Workflow filename: release.yml
#   Environment:       (leave empty)
# Optionally set "Require two-factor authentication and disallow tokens" so
# only this workflow can publish.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # npm Trusted Publishing (OIDC) + provenance
    steps:
      - name: Check out ${{ github.ref_name }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json `packageManager`)
        uses: pnpm/action-setup@v6

      # No `registry-url` here on purpose: it writes an .npmrc with
      # `_authToken=${NODE_AUTH_TOKEN}`, and any configured token (even an
      # empty or placeholder one) makes npm skip the OIDC handshake and fail
      # the PUT with a misleading E404. The registry is pinned on `npm publish`.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Trusted Publishing needs npm >= 11.5.1; always use the latest.
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Verify the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi
          if npm view "dsh-plugin-subscriptions@${version}" version >/dev/null 2>&1; then
            echo "::error::dsh-plugin-subscriptions@${version} is already published"
            exit 1
          fi
          case "${version}" in
            *-*) dist_tag=next;   prerelease=true ;;
            *)   dist_tag=latest; prerelease=false ;;
          esac
          echo "DIST_TAG=${dist_tag}" >> "$GITHUB_ENV"
          echo "PRERELEASE=${prerelease}" >> "$GITHUB_ENV"
          echo "Releasing ${version} (dist-tag: ${dist_tag})"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Show package contents
        run: npm pack --dry-run

      # Diagnostic only: print the OIDC claims npm will see and the registry's
      # answer to the token exchange, so a trusted-publisher mismatch names the
      # offending field instead of surfacing as a bare ENEEDAUTH/E404.
      - name: Check OIDC trusted publisher
        run: |
          set -uo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::warning::ACTIONS_ID_TOKEN_REQUEST_URL is unset: the job lacks id-token: write"
            exit 0
          fi
          jwt="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)"
          echo "OIDC claims:"
          printf '%s' "$jwt" | node -e '
            const payload = require("fs").readFileSync(0, "utf8").split(".")[1]
            const claims = JSON.parse(Buffer.from(payload, "base64url").toString())
            const keys = ["repository", "repository_owner", "workflow_ref", "job_workflow_ref", "ref", "event_name", "runner_environment", "aud"]
            console.log(JSON.stringify(Object.fromEntries(keys.map(k => [k, claims[k]])), null, 2))'
          name="$(node -p "require('./package.json').name")"
          code="$(curl -sS -o /tmp/exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${jwt}" -H 'Content-Type: application/json' \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name}")"
          echo "Token exchange: HTTP ${code}"
          jq 'del(.token)' /tmp/exchange.json 2>/dev/null || cat /tmp/exchange.json
          rm -f /tmp/exchange.json

      # No NODE_AUTH_TOKEN: npm authenticates with the job's OIDC token and
      # attaches a provenance attestation linking the tarball to this commit
      # and workflow run. `prepublishOnly`/`prepare` run as they do locally.
      - name: Publish to npm
        run: npm publish --registry=https://registry.npmjs.org --provenance --access public --tag "$DIST_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
